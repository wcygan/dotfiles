name: Ensure runner Nix is ready
description: Reuse the provisioned daemon or provision a fresh runner
runs:
  using: composite
  steps:
    - name: Probe the Nix daemon
      id: daemon
      shell: bash
      run: |
        nix_bin=$(command -v nix || true)
        if [[ -z "$nix_bin" ]]; then nix_bin=/nix/var/nix/profiles/default/bin/nix; fi
        if [[ -x "$nix_bin" ]] && "$nix_bin" --extra-experimental-features nix-command store ping --store daemon; then
          dirname "$nix_bin" >> "$GITHUB_PATH"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
        fi
    - name: Install Nix
      if: steps.daemon.outputs.ready != 'true'
      uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
      with:
        # GitHub throttled Magic Nix Cache on every run, so fetch straight
        # from the binary cache with more parallel downloads.
        extra-conf: |
          experimental-features = nix-command flakes
          max-substitution-jobs = 64
          http-connections = 128
