name: Install inputs changed
description: >-
  Report whether this change touches anything the install checks exercise, so
  a change to docs, tests or a skill pin does not rerun them.

outputs:
  changed:
    description: "'true' unless the change provably touches none of the install inputs."
    value: ${{ steps.diff.outputs.changed }}

runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      # Every doubt answers true: no base commit (a manual run or a new
      # branch), a base that cannot be fetched, or a diff that fails.
      run: |
        changed=true
        if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]] \
          && git fetch --quiet --depth=1 origin "$BASE"; then
          if git diff --quiet "$BASE" HEAD -- \
            bootstrap.sh src config \
            flake.nix flake.lock rust-toolchain.toml pyproject.toml uv.lock \
            Dockerfile.ubuntu Dockerfile.fedora .dockerignore \
            Makefile tests/docker_matrix.py .github; then
            changed=false
          fi
        fi
        echo "changed=$changed" >> "$GITHUB_OUTPUT"
        echo "Install inputs changed: $changed"
