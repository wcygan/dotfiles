name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell and Makefile syntax
        run: |
          bash -n bootstrap.sh
          bash -n config/shell-nix.sh
          make --dry-run help >/dev/null

      - name: Validate workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/ci.yml")'

  quality:
    name: Ruff, lockfile, and pytest
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4

      # Bootstrap is deliberately invoked only after the runner already has Nix.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Lint, verify lockfile, and run tests
        run: |
          nix develop .#default --command uv run --locked ruff check .
          nix develop .#default --command uv lock --check
          nix develop .#default --command uv run --locked pytest

  docker-matrix:
    name: Docker ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: syntax
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu
            dockerfile: Dockerfile.ubuntu
            tag: nixdotfiles:test-ubuntu
          - distro: Fedora
            dockerfile: Dockerfile.fedora
            tag: nixdotfiles:test-fedora
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build bootstrap validation image
        run: docker build --pull --file "${{ matrix.dockerfile }}" --tag "${{ matrix.tag }}" .

  native-bootstrap:
    name: Native bootstrap
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4

      # Do not pass --install-nix to bootstrap in CI: this action is the only installer.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Run bootstrap diagnostics and prove idempotency
        run: |
          ./bootstrap.sh doctor
          ./bootstrap.sh install
          ./bootstrap.sh install
          ./bootstrap.sh doctor

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [syntax, quality, docker-matrix, native-bootstrap]
    if: always()
    steps:
      - name: Require every job to pass
        run: |
          test "${{ needs.syntax.result }}" = success
          test "${{ needs.quality.result }}" = success
          test "${{ needs.docker-matrix.result }}" = success
          test "${{ needs.native-bootstrap.result }}" = success
