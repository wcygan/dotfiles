name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate shell and Makefile syntax
        run: |
          bash -n bootstrap.sh
          bash -n config/shell-nix.sh
          make --dry-run help >/dev/null

      - name: Validate workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/ci.yml")'

      - name: Verify tracked inputs are unchanged
        run: git diff --exit-code

  quality:
    name: Ruff, lockfile, and pytest
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Bootstrap is deliberately invoked only after the runner already has Nix.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@8a218f9e264e9c3803c9a1ee1c30d8e4ab55be63 # v2

      - name: Lint, verify lockfile, and run tests
        run: |
          nix develop --no-write-lock-file .#default --command uv run --locked ruff check .
          nix develop --no-write-lock-file .#default --command uv lock --check
          nix develop --no-write-lock-file .#default --command uv run --locked pytest

      - name: Verify tracked inputs are unchanged
        run: git diff --exit-code

  docker-matrix:
    name: Docker ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: syntax
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu
            dockerfile: Dockerfile.ubuntu
            tag: nixdotfiles:test-ubuntu
          - distro: Fedora
            dockerfile: Dockerfile.fedora
            tag: nixdotfiles:test-fedora
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build bootstrap validation image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "${{ matrix.tag }}" .

      - name: Verify tracked inputs are unchanged
        run: git diff --exit-code

  native-bootstrap:
    name: Native bootstrap
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Do not pass --install-nix to bootstrap in CI: this action is the only installer.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@8a218f9e264e9c3803c9a1ee1c30d8e4ab55be63 # v2

      - name: Run bootstrap diagnostics and prove idempotency
        run: |
          ./bootstrap.sh doctor
          ./bootstrap.sh install
          ./bootstrap.sh install
          ./bootstrap.sh doctor

      - name: Verify tracked inputs are unchanged
        run: git diff --exit-code

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [syntax, quality, docker-matrix, native-bootstrap]
    if: always()
    steps:
      - name: Require every job to pass
        run: |
          test "${{ needs.syntax.result }}" = success
          test "${{ needs.quality.result }}" = success
          test "${{ needs.docker-matrix.result }}" = success
          test "${{ needs.native-bootstrap.result }}" = success
