name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Locked quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
        with:
          # GitHub throttled Magic Nix Cache on every run, so fetch straight
          # from the binary cache with more parallel downloads.
          extra-conf: |
            experimental-features = nix-command flakes
            max-substitution-jobs = 64
            http-connections = 128

      - name: Run canonical syntax and quality checks
        env:
          PYTEST_ADDOPTS: --junitxml=reports/pytest.xml
        run: |
          mkdir -p reports
          make test-syntax
          make test-pre

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-linux
          path: reports/pytest.xml
          if-no-files-found: warn

      - name: Safe Nix failure diagnostics
        if: failure()
        run: |
          df -h / /nix || true
          nix store info || true

      - name: Verify tracked inputs are unchanged
        if: always()
        run: git diff --exit-code

  # A separate job so it runs beside the quality checks, not after them. This
  # is the per-change install that downloads everything itself.
  bootstrap:
    name: Native bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
        with:
          # GitHub throttled Magic Nix Cache on every run, so fetch straight
          # from the binary cache with more parallel downloads.
          extra-conf: |
            experimental-features = nix-command flakes
            max-substitution-jobs = 64
            http-connections = 128

      - name: Prove native bootstrap idempotency
        run: |
          ./bootstrap.sh doctor
          ./bootstrap.sh install
          ./bootstrap.sh install
          ./bootstrap.sh profile
          ./bootstrap.sh verify

      - name: Safe Nix failure diagnostics
        if: failure()
        run: |
          df -h / /nix || true
          nix profile list --json 2>/dev/null | jq '{elements: [.elements[]? | {name, storePaths}]}' || true
          nix store info || true

      - name: Verify tracked inputs are unchanged
        if: always()
        run: git diff --exit-code

  flake-eval:
    name: Four-system flake evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
        with:
          # GitHub throttled Magic Nix Cache on every run, so fetch straight
          # from the binary cache with more parallel downloads.
          extra-conf: |
            experimental-features = nix-command flakes
            max-substitution-jobs = 64
            http-connections = 128

      - name: Evaluate every declared system
        run: make test-eval

      - name: Safe Nix failure diagnostics
        if: failure()
        run: |
          df -h / /nix || true
          nix store info || true

      - name: Verify tracked inputs are unchanged
        if: always()
        run: git diff --exit-code

  docker-matrix:
    name: Docker ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The runner is discarded; removing the builder only costs time.
          cleanup: false

      # The slow layers depend only on these files, so a change anywhere else
      # restores them instead of downloading the Nix closure and Rust again.
      - name: Restore the locked-input layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/docker-layers
          key: docker-layers-${{ matrix.distro }}-${{ hashFiles(format('Dockerfile.{0}', matrix.distro), 'flake.nix', 'flake.lock', 'rust-toolchain.toml') }}

      - name: Build and run canonical distro acceptance
        env:
          DOCKER_CASE: ${{ matrix.distro }}
          DOCKER_LAYER_CACHE: ${{ runner.temp }}/docker-layers
        run: make test-docker

      - name: Safe Docker failure diagnostics
        if: failure()
        run: |
          df -h / || true
          docker system df || true
          docker buildx du || true

      - name: Verify tracked inputs are unchanged
        if: always()
        run: git diff --exit-code

  summary:
    name: CI summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [quality, bootstrap, flake-eval, docker-matrix]
    if: always()
    steps:
      - name: Require every validation job to pass
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.bootstrap.result }}" = success
          test "${{ needs.flake-eval.result }}" = success
          test "${{ needs.docker-matrix.result }}" = success
