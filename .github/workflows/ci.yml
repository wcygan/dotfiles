name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Locked quality and bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@8a218f9e264e9c3803c9a1ee1c30d8e4ab55be63 # v2

      - name: Run canonical syntax and quality checks
        env:
          PYTEST_ADDOPTS: --junitxml=reports/pytest.xml
        run: |
          mkdir -p reports
          make test-syntax
          make test-pre

      - name: Prove native bootstrap idempotency
        run: |
          ./bootstrap.sh doctor
          ./bootstrap.sh install
          ./bootstrap.sh install
          ./bootstrap.sh verify

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-linux
          path: reports/pytest.xml
          if-no-files-found: warn

      - name: Safe Nix failure diagnostics
        if: failure()
        run: |
          df -h / /nix || true
          nix profile list --json 2>/dev/null | jq '{elements: [.elements[]? | {name, storePaths}]}' || true
          nix store info || true

      - name: Verify tracked inputs are unchanged
        if: always()
        run: git diff --exit-code

  flake-eval:
    name: Four-system flake evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@8a218f9e264e9c3803c9a1ee1c30d8e4ab55be63 # v2

      - name: Evaluate every declared system
        run: make test-eval

      - name: Safe Nix failure diagnostics
        if: failure()
        run: |
          df -h / /nix || true
          nix store info || true

      - name: Verify tracked inputs are unchanged
        if: always()
        run: git diff --exit-code

  docs:
    name: Documentation build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build documentation through the canonical target
        run: make docs-build

      - name: Verify tracked inputs are unchanged
        if: always()
        run: git diff --exit-code

  docker-matrix:
    name: Docker ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Expose GitHub runtime for BuildKit cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build and run canonical distro acceptance
        env:
          DOCKER_CASE: ${{ matrix.distro }}
        run: make test-docker

      - name: Safe Docker failure diagnostics
        if: failure()
        run: |
          df -h / || true
          docker system df || true
          docker buildx du || true

      - name: Verify tracked inputs are unchanged
        if: always()
        run: git diff --exit-code

  summary:
    name: CI summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [quality, flake-eval, docs, docker-matrix]
    if: always()
    steps:
      - name: Require every validation job to pass
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.flake-eval.result }}" = success
          test "${{ needs.docs.result }}" = success
          test "${{ needs.docker-matrix.result }}" = success
