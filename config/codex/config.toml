# Personal Codex defaults tracked by dotfiles.
# Keep auth, generated state, and machine-specific [projects] trust entries out of git.
approval_policy = "never"
approvals_reviewer = "user"
sandbox_mode = "danger-full-access"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
model_verbosity = "low"

[plugins."github@openai-curated"]
enabled = true

[features]
goals = true
multi_agent_v2 = true
# Allow structured questions during Default-mode tasks.
default_mode_request_user_input = true

[agents]
# Spawned-agent cap; the primary task is additional.
max_concurrent_threads_per_session = 12
