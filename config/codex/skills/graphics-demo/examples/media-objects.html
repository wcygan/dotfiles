<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Media Objects Demo</title>
    <link rel="stylesheet" href="demo-styles.css">
    <style>
      .media-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(18rem, 100%), 1fr));
        gap: var(--space-4);
      }

      .media-figure {
        display: grid;
        gap: var(--space-3);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: var(--space-3);
        background: var(--surface);
      }

      .media-figure img {
        width: 100%;
        aspect-ratio: 16 / 10;
        border-radius: 7px;
        object-fit: cover;
        background: var(--surface-muted);
      }

      .media-figure.contain img {
        object-fit: contain;
        border: 1px dashed var(--line);
      }

      figcaption {
        color: var(--muted);
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <strong>HTML CSS Layout Lab</strong>
          <span>Media objects</span>
        </div>
        <nav class="demo-nav" aria-label="Demo navigation">
          <a href="semantic-document.html">Semantic</a>
          <a href="grid-dashboard.html">Grid</a>
          <a href="flex-toolbar.html">Flexbox</a>
          <a href="responsive-cards.html">Responsive</a>
          <a href="form-accessibility.html">Forms</a>
          <a href="cascade-tokens.html">Cascade</a>
          <a href="media-objects.html" aria-current="page">Media</a>
          <a href="data-table.html">Tables</a>
          <a href="disclosure-navigation.html">Disclosure</a>
          <a href="page-shell.html">Shell</a>
          <a href="motion-states.html">Motion</a>
          <a href="debugging-checklist.html">Debugging</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <section class="intro" aria-labelledby="page-title">
        <p class="pill">Stable media slots</p>
        <h1 id="page-title">Images need meaning and reserved space</h1>
        <p>Figures, captions, aspect ratios, and object fitting keep media readable before and after assets load.</p>
      </section>

      <section class="media-gallery" aria-label="Media object examples">
        <figure class="media-figure">
          <img
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 400'%3E%3Crect width='640' height='400' fill='%23dbeafe'/%3E%3Ccircle cx='172' cy='128' r='72' fill='%232563eb' opacity='.55'/%3E%3Cpath d='M0 320 L160 210 L280 290 L400 170 L640 330 L640 400 L0 400Z' fill='%230f8a5f' opacity='.72'/%3E%3C/svg%3E"
            width="640"
            height="400"
            alt="Abstract landscape with hills and a blue sun">
          <figcaption>Cover fitting is useful for thumbnails where a stable card shape matters more than showing every edge.</figcaption>
        </figure>

        <figure class="media-figure contain">
          <img
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Crect width='400' height='400' rx='48' fill='%23f5efe1'/%3E%3Cpath d='M200 56 L334 292 H66Z' fill='%23b7791f'/%3E%3Ccircle cx='200' cy='214' r='52' fill='%23ffffff'/%3E%3C/svg%3E"
            width="400"
            height="400"
            alt="Abstract badge with a triangle and center circle">
          <figcaption>Contain fitting preserves the whole asset when cropping would hide meaningful information.</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
