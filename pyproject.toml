[project]
name = "dotfiles-setup"
version = "0.1.0"
description = "Nix-backed setup automation for this dotfiles repository"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
dotfiles-setup = "dotfiles_setup.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
